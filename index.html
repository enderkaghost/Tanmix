<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paranóia RPG | Livro de Regras</title>
    <style>
        /* Estética Sombria */
        body {
            background-color: #1a0f0f; /* Fundo quase preto para destacar os PNGs */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 30px 0;
            background: linear-gradient(to bottom, #2b1d1d, #1a0f0f);
            border-bottom: 2px solid #7a0000;
            margin-bottom: 30px;
        }

        h1 {
            color: #b30000;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 3px 3px 5px #000;
            margin: 0;
        }

        /* Contentor das Imagens */
        .book-container {
            max-width: 800px;
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 20px; /* Espaço entre as páginas */
            padding-bottom: 50px;
        }

        .page-image {
            width: 100%;
            height: auto;
            border: 2px solid #3d2a2a;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            transition: transform 0.3s ease;
        }

        .page-image:hover {
            border-color: #b30000;
            transform: scale(1.01);
        }

        footer {
            color: #555;
            padding: 20px;
            font-size: 0.9em;
        }

        /* Scrollbar Personalizada (Estilo Dark) */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #1a0f0f; }
        ::-webkit-scrollbar-thumb { background: #7a0000; border-radius: 5px; }
    </style>
</head>
<body>

<header>
    <h1>PARANÓIA RPG</h1>
    <p style="color: #888;">Livro Oficial de Regras</p>
</header>

<div class="book-container">
    <img src="image_adfcff.jpg" alt="Apresentação" class="page-image">
    <img src="image_adfd03.jpg" alt="Como Mestrar e Dados" class="page-image">
    <img src="image_adfd23.jpg" alt="Tipos de Danos" class="page-image">
    <img src="image_adfd42.jpg" alt="O que é Paranóia" class="page-image">
    <img src="image_adfd3e.jpg" alt="Ficha de Personagem" class="page-image">
</div>

<footer>
    &copy; Paranóia RPG - Sistema Independente
</footer>

</body>
</html>
